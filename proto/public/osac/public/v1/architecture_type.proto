syntax = "proto3";

package osac.public.v1;

// CPU architecture for disk images and instance types.
enum Architecture {
  // Architecture is unknown or has not been specified.
  ARCHITECTURE_UNSPECIFIED = 0;

  // AMD64 (x86_64) architecture.
  ARCHITECTURE_AMD64 = 1;

  // ARM64 (aarch64) architecture.
  ARCHITECTURE_ARM64 = 2;
}
