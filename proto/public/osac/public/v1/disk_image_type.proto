syntax = "proto3";

package osac.public.v1;

import "osac/public/v1/architecture_type.proto";
import "osac/public/v1/metadata_type.proto";

// Lifecycle states for DiskImage resources.
enum DiskImageState {
  // State is unknown or has not been determined yet.
  DISK_IMAGE_STATE_UNSPECIFIED = 0;

  // The disk image is active and available for use.
  DISK_IMAGE_STATE_ACTIVE = 1;
}

// Represents a disk image in the OSAC platform.
//
// DiskImage is a catalog resource that defines an OS image available for provisioning compute
// instances. Users can list available disk images to select one when creating instances.
//
// buf:lint:ignore OSAC_OBJECT_SHAPE
message DiskImage {
  // Unique identifier of the disk image.
  string id = 1;

  // Metadata of the disk image.
  Metadata metadata = 2;

  // Desired configuration of the disk image.
  DiskImageSpec spec = 3;

  // Current operational status of the disk image.
  DiskImageStatus status = 4;
}

// Defines the configuration for a DiskImage.
message DiskImageSpec {
  // Human-readable description of the disk image.
  string description = 1;

  // CPU architectures supported by this disk image.
  repeated Architecture architectures = 2;
}

// Represents the current operational state of a DiskImage.
message DiskImageStatus {
  // Current lifecycle state of the disk image.
  DiskImageState state = 1;
}
